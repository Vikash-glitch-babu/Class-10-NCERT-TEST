let current=0;
let score=0;
let playerName="";
let selected=-1;

function startQuiz(){

playerName=document.getElementById("name").value.trim();

if(playerName===""){
alert("कृपया अपना नाम/निकनेम डालें।");
return;
}

document.getElementById("startScreen").classList.add("hidden");
document.getElementById("quizScreen").classList.remove("hidden");

current=0;
score=0;

showQuestion();
}

function showQuestion(){

selected=-1;

let q=questions[current];

document.getElementById("progress").innerText=
"प्रश्न "+(current+1)+" / "+questions.length;

document.getElementById("question").innerText=q.q;

let box=document.getElementById("options");
box.innerHTML="";

q.o.forEach((option,index)=>{

let btn=document.createElement("button");

btn.className="option";
btn.innerText=
String.fromCharCode(65+index)+". "+option;

btn.onclick=function(){

selected=index;

document.querySelectorAll(".option").forEach(x=>{
x.classList.remove("selected");
});

btn.classList.add("selected");
};

box.appendChild(btn);

});

document.getElementById("nextBtn").innerText=
current===questions.length-1 ? "Submit Quiz" : "Next";

}

function nextQuestion(){

if(selected===-1){
alert("कृपया एक उत्तर चुनें।");
return;
}

if(selected===questions[current].a){
score++;
}

current++;

if(current<questions.length){

showQuestion();

}else{

showResult();

}

}

function showResult(){

document.getElementById("quizScreen").classList.add("hidden");
document.getElementById("resultScreen").classList.remove("hidden");

let wrong=questions.length-score;

document.getElementById("resultName").innerText=
"नाम/निकनेम: "+playerName;

document.getElementById("scoreText").innerText=
score+" / "+questions.length;

document.getElementById("correctText").innerText=
"✅ सही: "+score;

document.getElementById("wrongText").innerText=
"❌ गलत: "+wrong;

document.getElementById("totalText").innerText=
"📊 कुल प्रश्न: "+questions.length;

}

</script>
